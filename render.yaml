# ==============================================================================
# SmartAttend AI - Render Infrastructure as Code Blueprint
# ==============================================================================
services:
  - type: web
    name: smartattend-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn smartattend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: sqlite
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://smartattend-ai.onrender.com,http://localhost:5173"
      - key: FRONTEND_URL
        value: "https://smartattend-ai.onrender.com"
